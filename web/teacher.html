<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MindMate — Teacher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="mobile.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237A62C4'/></svg>">
</head>
<body>
  <div id="app-container" class="app-container mode-desktop">

    <header class="top-nav glass-card" id="main-header"></header>

    <main class="main-content" id="main-content">

      <!-- HOME -->
      <section class="screen-view active" id="t-home">
        <div class="greeting-header">
          <div class="orb-deco" aria-hidden="true"><i></i><i></i></div>
          <div class="greeting-text">
            <h1 class="greeting-title" id="t-greeting">Hello</h1>
            <p class="greeting-sub" id="t-date">&nbsp;</p>
          </div>
        </div>

        <div class="glass-card tint-pink attendance-card">
          <div class="att-left">
            <div>
              <div class="att-title">Today's Attendance</div>
              <div class="att-sub" id="t-att-sub">Loading</div>
            </div>
          </div>
          <div class="att-right">
            <span id="t-att-pill" class="att-pill">Loading</span>
            <button type="button" class="btn-ghost-sm" id="t-refresh" aria-label="Refresh attendance">Refresh</button>
          </div>
          <div id="t-home-att" class="school-att" aria-live="polite"></div>
        </div>

        <div class="glass-card" id="t-alert-summary"></div>

        <div class="entries-stream-section">
          <div class="section-title-row">
            <h3 class="section-title">Recent journal activity</h3>
          </div>
          <div class="entries-list" id="t-journal"></div>
        </div>
      </section>

      <!-- ATTENDANCE -->
      <section class="screen-view" id="t-attendance">
        <div class="screen-header">
          <div class="orb-deco small" aria-hidden="true"><i></i><i></i></div>
          <div>
            <h2 class="page-title">Attendance</h2>
            <p class="page-sub" id="t-att-day-label">Pick a day</p>
          </div>
        </div>
        <div class="date-strip" id="t-date-strip" role="tablist" aria-label="Pick a day"></div>
        <div id="t-att-state" aria-live="polite"></div>
        <div class="entries-list" id="t-att-list"></div>
        <p class="att-note">Taps come from the RFID sheet and cannot be edited here.</p>
        <div class="glass-card" id="t-unmatched" style="display:none"></div>
      </section>

      <!-- STUDENTS -->
      <section class="screen-view" id="t-students">
        <div class="screen-header">
          <div class="orb-deco small" aria-hidden="true"><i></i><i></i></div>
          <div>
            <h2 class="page-title">Students</h2>
            <p class="page-sub" id="t-students-sub">This month</p>
          </div>
        </div>
        <div class="entries-list" id="t-student-list"></div>
      </section>

      <!-- ALERTS -->
      <section class="screen-view" id="t-alerts">
        <div class="screen-header">
          <div class="orb-deco small" aria-hidden="true"><i></i><i></i></div>
          <div>
            <h2 class="page-title">Alerts</h2>
            <p class="page-sub">Journal entries that need attention.</p>
          </div>
        </div>
        <div class="filters-scroll-container" id="t-alert-filters"></div>
        <div class="entries-list" id="t-alert-list"></div>
      </section>

      <!-- STUDENT DETAIL (opened from Attendance or Students) -->
      <section class="screen-view" id="t-detail">
        <div class="detail-top">
          <button type="button" class="btn-ghost-sm" id="t-back">Back</button>
          <div class="month-nav">
            <button type="button" class="btn-icon" id="t-prev-month" aria-label="Previous month">&lsaquo;</button>
            <span id="t-month-label"></span>
            <button type="button" class="btn-icon" id="t-next-month" aria-label="Next month">&rsaquo;</button>
          </div>
        </div>
        <div class="glass-card" id="t-detail-card"></div>
      </section>
    </main>

    <nav class="phone-bottom-nav glass-card" id="t-nav" aria-label="Teacher navigation">
      <button type="button" class="phone-nav-item active" data-tab="home" aria-label="Home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </button>
      <button type="button" class="phone-nav-item" data-tab="attendance" aria-label="Attendance">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </button>
      <button type="button" class="phone-nav-item" data-tab="students" aria-label="Students">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      </button>
      <button type="button" class="phone-nav-item" data-tab="alerts" aria-label="Alerts">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span class="nav-badge" id="t-alert-badge" style="display:none">0</span>
      </button>
    </nav>
  </div>

  <!-- Journal entry modal (same modal style as the student app) -->
  <div class="modal-backdrop" id="t-modal">
    <div class="glass-modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="t-modal-title">Entry</h3>
        <button type="button" class="btn-close-modal" id="t-modal-close" aria-label="Close">&times;</button>
      </div>
      <p class="muted small" id="t-modal-meta"></p>
      <p id="t-modal-body" style="margin-top:12px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
      <div class="modal-actions">
        <button type="button" class="btn-ghost" id="t-modal-dismiss">Close</button>
        <button type="button" class="btn-primary" id="t-modal-resolve">Mark resolved</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="shared.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
